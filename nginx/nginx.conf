# ============================================
# IPTV Proxy - Nginx Configuration
# ============================================
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Resolver DNS para proxy_pass con variables
    # Usar DNS de Docker para resolver nombres de servicios dinámicamente
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Map para ocultar contraseñas en logs
    # Reemplaza el segundo segmento de la URL (password) con "xxxx"
    map $request $request_filtered {
        ~^(.*\/[^\/]+\/)([^\/]+)(\/.*)$ $1xxxx$3;
        default $request;
    }

    # Map para definir la URL del API (resuelve dinámicamente en Docker)
    map $http_host $iptv_api_url {
        default "iptv-api:3010";
    }

    # Logging format - oculta contraseñas en URLs
    log_format main '$remote_addr - $remote_user [$time_local] "$request_filtered" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Debug logging format - oculta contraseñas
    log_format debug '$remote_addr - $remote_user [$time_local] "$request_filtered" '
                     'location=$uri args="$args" '
                     'uri="$request_uri" host="$host" '
                     'xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    # Log de debug adicional (también con contraseñas ocultas)
    access_log /var/log/nginx/debug-access.log debug;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Buffers
    client_body_buffer_size 10M;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/vnd.apple.mpegurl;

    server {
        listen 80;
        server_name _;

        # ============================================
        # Health Check
        # ============================================
        location /health {
            proxy_pass http://$iptv_api_url/health;
            proxy_http_version 1.1;
        }

        # ============================================
        # API Backend (panel admin)
        # /api/* - DEBE ir antes de las locations regex
        # ====================================
        location /api/ {
            # CORS Preflight - pasar Origin a la API para que valide
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Para peticiones reales, pasar el Origin a la API
            # La API (FastAPI) validará y responderá con el header CORS correcto
            proxy_pass http://$iptv_api_url;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # IMPORTANTE: Pasar el Origin original a la API para CORS
            proxy_set_header Origin $http_origin;
        }

        # ============================================
        # ============================================
        # Playlist M3U - Formato proveedor típico
        # /get.php?username=X&password=Y&type=m3u_plus
        # ============================================
        location = /get.php {
        proxy_pass http://$iptv_api_url/get.php?username=$arg_username&password=$arg_password;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Accept-Encoding "";

        proxy_cache_bypass 1;
        proxy_no_cache 1;
        gzip off;

        proxy_pass_header Content-Length;
        proxy_pass_header Content-Disposition;
        proxy_pass_header Content-Description;
        proxy_pass_header Cache-Control;
        proxy_pass_header Pragma;
        proxy_pass_header Expires;

        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        }

        # ============================================
        # Xtream Codes API
        # /player_api.php?username=X&password=Y&action=...
        # ============================================
        location = /player_api.php {
            proxy_pass http://$iptv_api_url/player_api.php?username=$arg_username&password=$arg_password&action=$arg_action&category_id=$arg_category_id&vod_id=$arg_vod_id&series_id=$arg_series_id&stream_id=$arg_stream_id;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ====================================
        # Placeholder Images (imágenes por defecto)
        # Sirve imágenes estáticas desde resources/images/
        # ====================================
        location ~ ^/placeholder/(channels|movies|series)\.png$ {
            alias /app/resources/images/$1.png;
            
            # Headers para imágenes
            add_header Content-Type "image/png" always;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Access-Control-Allow-Origin '*' always;
            
            # Si el archivo no existe, devolver 404
            try_files $uri =404;
        }

        # Alias simple para acceso directo
        location = /placeholder/channel { return 301 /placeholder/channels.png; }
        location = /placeholder/movie { return 301 /placeholder/movies.png; }
        location = /placeholder/series { return 301 /placeholder/series.png; }

        # ====================================
        # Proxy de Logos/Imágenes
        # Usa query string ?url= para pasar la URL original
        # Soporta tanto /logo como /logo/ (con y sin trailing slash)
        # ====================================
        location = /logo {
            proxy_pass http://$iptv_api_url/logo?url=$arg_url;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_cache off;
            proxy_buffering off;

            add_header Access-Control-Allow-Origin '*' always;
            add_header Cache-Control "public, max-age=86400" always;
            
            # Fallback a placeholder si el proxy falla (4xx o 5xx)
            # Usar el tipo especificado en ?type= o default a channels
            error_page 400 401 402 403 404 500 501 502 503 504 = @placeholder_fallback;
        }

        # Location interno para fallback de placeholders
        location @placeholder_fallback {
            # Redirigir al placeholder según el tipo
            if ($arg_type = "movie") {
                return 302 /placeholder/movies.png;
            }
            if ($arg_type = "series") {
                return 302 /placeholder/series.png;
            }
            # Default: channel
            return 302 /placeholder/channels.png;
        }

        # Redirect /logo/ (con trailing slash) a /logo (sin trailing slash)
        location = /logo/ {
            return 301 /logo?url=$arg_url;
        }

        # ============================================
        # Movie Streams DIRECTO - Redirect al proveedor
        # /movie/{username}/{password}/{provider_id}
        # ============================================
        location ~ ^/movie/([^/]+)/([^/]+)/(.+)$ {
            proxy_pass http://$iptv_api_url/internal/stream-url?user=$1&password=$2&id=$3&type=movie;
            proxy_http_version 1.1;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_redirect off;
            
            proxy_connect_timeout 15s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
            
            add_header X-Proxied "nginx-movie" always;
        }

        # ============================================
        # Series Streams DIRECTO - Redirect al proveedor
        # /series/{username}/{password}/{provider_id}
        # ============================================
        location ~ ^/series/([^/]+)/([^/]+)/(.+)$ {
            proxy_pass http://$iptv_api_url/internal/stream-url?user=$1&password=$2&id=$3&type=series;
            proxy_http_version 1.1;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_redirect off;
            
            proxy_connect_timeout 15s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
            
            add_header X-Proxied "nginx-series" always;
        }

        # ============================================
        # Live Streams DIRECTO - Redirect al proveedor (sin Python)
        # /live/{username}/{password}/{provider_id}
        # Solo para uso externo (no desde web HTTPS)
        # ============================================
        location ~ ^/live/([^/]+)/([^/]+)/(\d+)$ {
            proxy_pass http://$iptv_api_url/internal/stream-url?user=$1&password=$2&id=$3&type=live;
            proxy_http_version 1.1;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_redirect off;
            
            proxy_connect_timeout 15s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
            
            add_header X-Proxied "nginx-live" always;
        }

        # ============================================
        # Live Streams (canales en vivo) - Proxy completo a través de API
        # /{username}/{password}/{provider_id} (sin /live/)
        # ============================================
        # Live Streams (canales en vivo) - Proxy completo a través de API
        # /{username}/{password}/{provider_id} (sin /live/)
        # ============================================
        location ~ ^/([^/]+)/([^/]+)/(\d+)$ {
            proxy_pass http://$iptv_api_url/$1/$2/$3;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;

            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin 'http://localhost:4200 https://walactvweb.walerike.com' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range, Authorization, Origin' always;
        }

        # ============================================
        # HLS Transcoded Streams
        # /hls/{session_id}/playlist.m3u8
        # ============================================
        location ~ ^/hls/(.+)/playlist\.m3u8$ {
            proxy_pass http://$iptv_api_url/hls/$1/playlist.m3u8;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers for HLS - only allowed origins
            add_header Access-Control-Allow-Origin 'http://localhost:4200 https://walactvweb.walerike.com' always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range' always;
            add_header Cache-Control 'no-cache' always;

            proxy_buffering off;
            proxy_cache off;
        }

        # HLS segment files (.ts)
        location ~ ^/hls/(.+)/(.+\.ts)$ {
            proxy_pass http://$iptv_api_url/hls/$1/$2;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header Access-Control-Allow-Origin 'http://localhost:4200 https://walactvweb.walerike.com' always;
            add_header Cache-Control 'public, max-age=3600' always;

            proxy_buffering off;
            proxy_cache off;
        }

        # ============================================
        # Swagger/OpenAPI Docs
        # ============================================
        location /docs {
            proxy_pass http://$iptv_api_url/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://$iptv_api_url/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://$iptv_api_url/redoc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ============================================
        # Root - Info y catch-all
        # ============================================
        location / {
            # Log de rutas que caen aquí
            access_log /var/log/nginx/root-access.log;

            default_type application/json;
            return 200 '{
    "service": "IPTV Proxy System",
    "status": "running",
    "endpoints": {
        "playlist": "/get.php?username=USER&password=PASS",
        "live": "/live/USER/PASS/STREAM_ID",
        "movie": "/movie/USER/PASS/STREAM_ID",
        "series": "/series/USER/PASS/STREAM_ID",
        "api": "/api/",
        "docs": "/docs"
    }
}';
        }
    }
}
