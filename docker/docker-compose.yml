# ============================================
# IPTV System - Docker Compose (Traefik Edition)
# Configurado para Dokploy con Traefik como reverse proxy
# ============================================
version: '3.8'

services:
  # ============================================
  # API Backend (FastAPI)
  # ============================================
  iptv-api:
    build:
      context: ..  # Contexto desde la raíz del proyecto
      dockerfile: docker/Dockerfile
      args:
        IPTV_DB_REF: ${IPTV_DB_REF:-main}
    container_name: ${IPTV_CONTAINER_PREFIX:-iptv}-api
    restart: unless-stopped
    ports:
      - "${IPTV_HOST_PORT:-3010}:3010"
    env_file:
      - .env
    environment:
      # Docker flag
      - DOCKER_CONTAINER=true
      # M3U
      - M3U_DIR=/app/data/m3u
      # Public domain (para generar URLs en M3U)
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-https://localhost}
      # Microservicio Playwright para extracción de video
      - VIDEO_EXTRACTOR_URL=http://video-extractor:8001
    volumes:
      # Volumen compartido entre todos los servicios
      - iptv-data:/app/data
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    mem_limit: 1g
    networks:
      - iptv-network
      - dokploy-network
      - iptv-ecosystem
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 40s
    labels:
      # Traefik: API endpoints van directo al contenedor (sin pasar por nginx)
      - "traefik.enable=true"
      # Router para /api/* y /docs/* (prioridad alta) - Con HTTPS
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-api.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`) && (PathPrefix(`/api/`) || PathPrefix(`/docs`) || PathPrefix(`/openapi`) || PathPrefix(`/redoc`))"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-api.entrypoints=websecure"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-api.tls=true"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-api.priority=100"
      - "traefik.http.services.${IPTV_ROUTER_PREFIX:-iptv}-api.loadbalancer.server.port=3010"
      - "traefik.http.services.${IPTV_ROUTER_PREFIX:-iptv}-api.loadbalancer.passhostheader=true"
      - "traefik.http.services.${IPTV_ROUTER_PREFIX:-iptv}-api.loadbalancer.responseforwarding.flushinterval=100ms"

  # ============================================
  # Nginx Reverse Proxy (para streams y playlist)
  # ============================================
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: ${IPTV_CONTAINER_PREFIX:-iptv}-nginx
    restart: unless-stopped
    volumes:
      # Volumen compartido (solo lectura) y SSL
      - iptv-data:/app/data:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      # Placeholder images
      - ../resources/images:/app/resources/images:ro
    depends_on:
      iptv-api:
        condition: service_healthy
    networks:
      - iptv-network
      - dokploy-network
      - iptv-ecosystem
    labels:
      - "traefik.enable=true"

      # ── Middleware vacío para evitar heredar el redirect HTTP→HTTPS de Dokploy ──
      - "traefik.http.middlewares.${IPTV_ROUTER_PREFIX:-iptv}-no-redirect.headers.customrequestheaders.X-Placeholder=1"

      # ── Router HTTPS (general) ─────────────────────────────────────
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-https.rule=Host(`${TRAEFIK_DOMAIN:-iptv.walerike.com}`)"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-https.entrypoints=websecure"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-https.tls=true"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-https.priority=10"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-https.service=${IPTV_ROUTER_PREFIX:-iptv}-service"

      # ── Router HTTP general (prioridad baja) ──────────────────────
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-http.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-http.entrypoints=web"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-http.priority=20"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-http.service=${IPTV_ROUTER_PREFIX:-iptv}-service"

      # ── Rutas IPTV: HTTP sin redirect (prioridad 200) ─────────────
      # /get.php, /live/, /movie/, /series/ nunca redirigen a HTTPS
      # El middleware iptv-no-redirect evita heredar el redirect global de Dokploy
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-streams-http.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`) && (Path(`/get.php`) || PathPrefix(`/live/`) || PathPrefix(`/movie/`) || PathPrefix(`/series/`))"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-streams-http.entrypoints=web"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-streams-http.priority=200"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-streams-http.service=${IPTV_ROUTER_PREFIX:-iptv}-service"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-streams-http.middlewares=${IPTV_ROUTER_PREFIX:-iptv}-no-redirect@docker"

      # ── Imágenes generadas: HTTP sin redirect y HTTPS explícito ─────────
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-http.rule=Host(`${TRAEFIK_DOMAIN:-iptv.walerike.com}`) && PathPrefix(`/images/`)"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-http.entrypoints=web"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-http.priority=250"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-http.service=${IPTV_ROUTER_PREFIX:-iptv}-service"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-http.middlewares=${IPTV_ROUTER_PREFIX:-iptv}-no-redirect@docker"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-https.rule=Host(`${TRAEFIK_DOMAIN:-iptv.walerike.com}`) && PathPrefix(`/images/`)"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-https.entrypoints=websecure"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-https.tls=true"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-https.priority=250"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-images-https.service=${IPTV_ROUTER_PREFIX:-iptv}-service"

      # ── Servicio compartido ────────────────────────────────────────
      - "traefik.http.services.${IPTV_ROUTER_PREFIX:-iptv}-service.loadbalancer.server.port=80"
      - "traefik.http.routers.${IPTV_ROUTER_PREFIX:-iptv}-streams-http.rule=Host(`${TRAEFIK_DOMAIN:-iptv.walerike.com}`) && (Path(`/get.php`) || Path(`/player_api.php`) || PathPrefix(`/live/`) || PathPrefix(`/movie/`) || PathPrefix(`/series/`))"

  # ============================================
  # Video Extractor Service (Playwright)
  # ============================================
  video-extractor:
    build:
      context: ../video-extractor-service
      dockerfile: Dockerfile
    container_name: ${IPTV_CONTAINER_PREFIX:-iptv}-video-extractor
    restart: unless-stopped
    ports:
      - "${VIDEO_EXTRACTOR_HOST_PORT:-8001}:8001"
    networks:
      - iptv-network
      - iptv-ecosystem
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ============================================
# Networks
# ============================================
networks:
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
  iptv-network:
    driver: bridge
  iptv-ecosystem:
    external: ${IPTV_ECOSYSTEM_EXTERNAL:-true}
    name: ${IPTV_ECOSYSTEM_NETWORK:-iptv-ecosystem}

# ============================================
# Volumes
# ============================================
volumes:
  iptv-data:
    external: ${IPTV_DATA_EXTERNAL:-true}
    name: ${IPTV_DATA_VOLUME:-iptv-data}
