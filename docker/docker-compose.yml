# ============================================
# IPTV System - Docker Compose (Traefik Edition)
# Configurado para Dokploy con Traefik como reverse proxy
# ============================================
version: '3.8'

services:
  # ============================================
  # API Backend (FastAPI)
  # ============================================
  iptv-api:
    build:
      context: ..  # Contexto desde la raíz del proyecto
      dockerfile: docker/Dockerfile
    container_name: iptv-api
    restart: unless-stopped
#    ports:
#      - "3010:3010"
    env_file:
      - .env
    environment:
      # Docker flag
      - DOCKER_CONTAINER=true
      # M3U
      - M3U_DIR=/app/data/m3u
      # Public domain (para generar URLs en M3U)
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-http://localhost}
    volumes:
      # Montar directorio local de datos (incluye playlist.m3u)
      - ../data:/app/data
    networks:
      - iptv-network
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Traefik: API endpoints van directo al contenedor (sin pasar por nginx)
      - "traefik.enable=true"
      # Router para /api/* y /docs/* (prioridad alta)
      - "traefik.http.routers.iptv-api.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`) && (PathPrefix(`/api/`) || PathPrefix(`/docs`) || PathPrefix(`/openapi`) || PathPrefix(`/redoc`))"
      - "traefik.http.routers.iptv-api.entrypoints=websecure"
      - "traefik.http.routers.iptv-api.tls=true"
      - "traefik.http.routers.iptv-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iptv-api.priority=100"
      - "traefik.http.services.iptv-api.loadbalancer.server.port=3010"


  # ============================================
  # Nginx Reverse Proxy (para streams y playlist)
  # ============================================
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: iptv-nginx
    restart: unless-stopped
    volumes:
      # Solo montar datos, NO la config (está en la imagen)
      - ../data:/app/data:ro
    depends_on:
      iptv-api:
        condition: service_healthy
    networks:
      - iptv-network
      - dokploy-network
    labels:
      # Traefik: Todo EXCEPTO /api/* va a nginx
      - "traefik.enable=true"
      - "traefik.http.routers.iptv-nginx.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.iptv-nginx.entrypoints=websecure"
      - "traefik.http.routers.iptv-nginx.tls=true"
      - "traefik.http.routers.iptv-nginx.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iptv-nginx.priority=10"
      - "traefik.http.services.iptv-nginx.loadbalancer.server.port=80"

  # ============================================
  # Sync Scheduler (Supercronic)
  # Ejecuta sync_iptv.py automáticamente cada 2 horas
  # ============================================
  sync-scheduler:
    build:
      context: ..  # Contexto desde la raíz del proyecto
      dockerfile: docker/Dockerfile.sync
    container_name: iptv-sync-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker flag
      - DOCKER_CONTAINER=true
      # M3U
      - M3U_DIR=/app/data/m3u
      # Public domain (para URLs en M3U)
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-http://localhost}
    volumes:
      # Compartir datos con la API (lectura/escritura)
      - ../data:/app/data
    networks:
      - iptv-network
      - dokploy-network
    depends_on:
      - iptv-api
    # No expone puertos, solo ejecuta cron internamente
    # Logs: docker logs -f iptv-sync-scheduler

# ============================================
# Networks
# ============================================
networks:
  dokploy-network:
    external: true
  iptv-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  iptv-data:
    driver: local
