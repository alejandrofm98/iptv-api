# ============================================
# IPTV System - Docker Compose (Traefik Edition)
# Configurado para Dokploy con Traefik como reverse proxy
# ============================================
version: '3.8'

services:
  # ============================================
  # API Backend (FastAPI)
  # ============================================
  iptv-api:
    build:
      context: ..  # Contexto desde la raíz del proyecto
      dockerfile: docker/Dockerfile
    container_name: iptv-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker flag
      - DOCKER_CONTAINER=true
      # M3U
      - M3U_DIR=/app/data/m3u
      # Public domain (para generar URLs en M3U)
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-http://localhost}
    volumes:
      # Montar directorio local de datos (incluye playlist.m3u)
      - ../data:/app/data
    networks:
      - iptv-network
      - traefik-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Traefik labels para acceso directo a la API (opcional)
      - "traefik.enable=true"
      # Router para api.tudominio.com (acceso directo a FastAPI)
      - "traefik.http.routers.iptv-api.rule=Host(`api.${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.iptv-api.entrypoints=websecure"
      - "traefik.http.routers.iptv-api.tls=true"
      - "traefik.http.routers.iptv-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iptv-api.middlewares=iptv-api-stripprefix"
      # Servicio
      - "traefik.http.services.iptv-api.loadbalancer.server.port=3001"
      - "traefik.http.services.iptv-api.loadbalancer.server.scheme=http"
      # Health check
      - "traefik.http.services.iptv-api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.iptv-api.loadbalancer.healthcheck.interval=30s"
      # Middleware para quitar prefijo si es necesario
      - "traefik.http.middlewares.iptv-api-stripprefix.stripprefix.prefixes=/api"

  # ============================================
  # Nginx Reverse Proxy (Entrypoint principal)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: iptv-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro  # Backup local (Traefik maneja SSL)
      - ../data:/app/data:ro  # Acceso de solo lectura a archivos M3U
    depends_on:
      iptv-api:
        condition: service_healthy
    networks:
      - iptv-network
      - traefik-network  # Red compartida con Traefik
    labels:
      # Habilitar Traefik
      - "traefik.enable=true"
      
      # Router HTTP → HTTPS (redirección)
      - "traefik.http.routers.iptv-http.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.iptv-http.entrypoints=web"
      - "traefik.http.routers.iptv-http.middlewares=redirect-to-https"
      
      # Router HTTPS principal
      - "traefik.http.routers.iptv.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.iptv.entrypoints=websecure"
      - "traefik.http.routers.iptv.tls=true"
      - "traefik.http.routers.iptv.tls.certresolver=letsencrypt"
      
      # Servicio (load balancer)
      - "traefik.http.services.iptv.loadbalancer.server.port=80"
      - "traefik.http.services.iptv.loadbalancer.server.scheme=http"
      
      # Health check para Traefik
      - "traefik.http.services.iptv.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.iptv.loadbalancer.healthcheck.interval=30s"
      
      # Middleware: Redirección HTTP → HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  # ============================================
  # Sync Scheduler (Supercronic)
  # Ejecuta sync_iptv.py automáticamente cada 2 horas
  # ============================================
  sync-scheduler:
    build:
      context: ..  # Contexto desde la raíz del proyecto
      dockerfile: docker/Dockerfile.sync
    container_name: iptv-sync-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker flag
      - DOCKER_CONTAINER=true
      # M3U
      - M3U_DIR=/app/data/m3u
      # Public domain (para URLs en M3U)
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-http://localhost}
    volumes:
      # Compartir datos con la API (lectura/escritura)
      - ../data:/app/data
    networks:
      - iptv-network
    depends_on:
      - iptv-api
    # No expone puertos, solo ejecuta cron internamente
    # Logs: docker logs -f iptv-sync-scheduler

# ============================================
# Networks
# ============================================
networks:
  iptv-network:
    driver: bridge
    
  traefik-network:
    external: true  # Red externa creada por Traefik/Dokploy
    name: traefik-network  # Nombre estándar en Dokploy

# ============================================
# Volumes
# ============================================
volumes:
  iptv-data:
    driver: local
