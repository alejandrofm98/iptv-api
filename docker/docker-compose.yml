# ============================================
# IPTV System - Docker Compose (Traefik Edition)
# Configurado para Dokploy con Traefik como reverse proxy
# ============================================
version: '3.8'

services:
  # ============================================
  # API Backend (FastAPI)
  # ============================================
  iptv-api:
    build:
      context: ..  # Contexto desde la raíz del proyecto
      dockerfile: docker/Dockerfile
    container_name: iptv-api
    restart: unless-stopped
    ports:
      - "3010:3010"
    env_file:
      - .env
    environment:
      # Docker flag
      - DOCKER_CONTAINER=true
      # M3U
      - M3U_DIR=/app/data/m3u
      # Public domain (para generar URLs en M3U)
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-https://localhost}
    volumes:
      # Volumen compartido entre todos los servicios
      - iptv-data:/app/data
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    networks:
      - iptv-network
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Traefik: API endpoints van directo al contenedor (sin pasar por nginx)
      - "traefik.enable=true"
      # Router para /api/* y /docs/* (prioridad alta) - Con HTTPS
      - "traefik.http.routers.iptv-api.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`) && (PathPrefix(`/api/`) || PathPrefix(`/docs`) || PathPrefix(`/openapi`) || PathPrefix(`/redoc`))"
      - "traefik.http.routers.iptv-api.entrypoints=websecure"
      - "traefik.http.routers.iptv-api.tls=true"
      - "traefik.http.routers.iptv-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iptv-api.priority=100"
      - "traefik.http.services.iptv-api.loadbalancer.server.port=3010"
      # NOTA: CORS se maneja en FastAPI (scripts/api.py), no en Traefik (para evitar duplicados)
      # Timeouts
      - "traefik.http.services.iptv-api.loadbalancer.passhostheader=true"
      - "traefik.http.services.iptv-api.loadbalancer.responseforwarding.flushinterval=100ms"


  # ============================================
  # Nginx Reverse Proxy (para streams y playlist)
  # ============================================
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: iptv-nginx
    restart: unless-stopped
    volumes:
      # Volumen compartido (solo lectura) y SSL
      - iptv-data:/app/data:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      iptv-api:
        condition: service_healthy
    networks:
      - iptv-network
      - dokploy-network
    labels:
      # Traefik: enable
      - "traefik.enable=true"
      # Router HTTPS
      - "traefik.http.routers.iptv-https.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.iptv-https.entrypoints=websecure"
      - "traefik.http.routers.iptv-https.tls=true"
      - "traefik.http.routers.iptv-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iptv-https.priority=10"
      - "traefik.http.routers.iptv-https.service=iptv-service"
      # Router HTTP (puerto 80) - sin redirect a HTTPS
      - "traefik.http.routers.iptv-http.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.iptv-http.entrypoints=http"
      - "traefik.http.routers.iptv-http.priority=20"
      - "traefik.http.routers.iptv-http.service=iptv-service"
      # Servicio único para ambos
      - "traefik.http.services.iptv-service.loadbalancer.server.port=80"
      # NOTA: CORS se maneja en nginx, no en Traefik (para evitar duplicados)

# ============================================
# Networks
# ============================================
networks:
  dokploy-network:
    external: true
  iptv-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  iptv-data:
    external: true
