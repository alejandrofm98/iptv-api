version: "3.8"

services:
  iptv-api:
    build: .
    ports:
      - "3010:3010"
    environment:
      - VIDEO_EXTRACTOR_URL=http://video-extractor:8001
    depends_on:
      video-extractor:
        condition: service_healthy
    restart: unless-stopped

  video-extractor:
    build: ./video-extractor-service
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
